<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE8F0"/>
      <stop offset="100%" stop-color="#F5D1DD"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E87A9B"/>
      <stop offset="100%" stop-color="#C45A7A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg3)"/>
  <ellipse cx="400" cy="680" rx="260" ry="20" fill="#000" opacity="0.08"/>
  <!-- Cartuchera cilíndrica horizontal -->
  <rect x="160" y="340" width="480" height="200" rx="100" fill="url(#pencil)"/>
  <!-- Tapas laterales -->
  <ellipse cx="160" cy="440" rx="22" ry="100" fill="#A84A6A"/>
  <ellipse cx="640" cy="440" rx="22" ry="100" fill="#A84A6A"/>
  <!-- Cremallera superior -->
  <rect x="180" y="435" width="440" height="10" rx="5" fill="#7A3550"/>
  <g fill="#FFD93D">
    <circle cx="440" cy="440" r="10"/>
  </g>
  <!-- Detalles: corazones bordados -->
  <text x="320" y="510" font-size="38" fill="#FFF4E6" opacity="0.8">♥</text>
  <text x="480" y="510" font-size="38" fill="#FFF4E6" opacity="0.8">♥</text>
  <text x="400" y="540" font-size="30" fill="#FFF4E6" opacity="0.8">♥</text>
  <!-- Línea decorativa inferior -->
  <path d="M 200 510 Q 400 530 600 510" stroke="#FFF4E6" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
