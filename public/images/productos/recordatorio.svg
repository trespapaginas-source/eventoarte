<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#A87B4F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg5)"/>
  <ellipse cx="400" cy="680" rx="180" ry="18" fill="#000" opacity="0.08"/>
  <!-- Caja (vista 3/4) -->
  <!-- Base de la caja -->
  <path d="M 270 360 L 530 360 L 560 400 L 560 620 L 530 660 L 270 660 L 240 620 L 240 400 Z" fill="url(#box)"/>
  <!-- Tapa abierta detrás -->
  <path d="M 250 360 L 290 320 L 540 320 L 560 360 Z" fill="#8B6F47"/>
  <!-- Interior visible -->
  <path d="M 280 365 L 520 365 L 540 395 L 260 395 Z" fill="#FFF4E6"/>
  <!-- Lazo/moña decorativa -->
  <g>
    <path d="M 360 320 Q 340 300 360 285 Q 380 300 360 320" fill="#C45A7A"/>
    <path d="M 440 320 Q 460 300 440 285 Q 420 300 440 320" fill="#C45A7A"/>
    <circle cx="400" cy="320" r="12" fill="#A84A6A"/>
  </g>
  <!-- Etiqueta en la caja -->
  <rect x="340" y="470" width="120" height="80" rx="6" fill="#FFF4E6" opacity="0.95"/>
  <text x="400" y="505" font-size="18" text-anchor="middle" fill="#8B6F47" font-family="Georgia">¡Gracias!</text>
  <text x="400" y="530" font-size="14" text-anchor="middle" fill="#A87B4F" font-family="Arial">eventoarte.co</text>
  <!-- Líneas decorativas doradas -->
  <line x1="290" y1="590" x2="510" y2="590" stroke="#E8B339" stroke-width="1.5" opacity="0.6"/>
</svg>
